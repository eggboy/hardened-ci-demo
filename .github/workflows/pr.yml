name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Google CodeMender: verifies scan execution health, uploads SARIF to GitHub code scanning,
  # and exports CRITICAL,HIGH,MEDIUM findings to CodeMender autofix. The repository's Require
  # code scanning results ruleset (Medium or higher) enforces merge protection on pull requests.
  codemender:
    uses: eggboy/codemender-action/.github/workflows/codemender.yml@6b1293fce004eb4ce44b05bebeca0f6a2173e90e # v0.22.0
    with:
      fail-on: CRITICAL,HIGH,MEDIUM
      fail-check: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write
      actions: read
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

  # GitHub dependency review: fails the check when the pull request adds or upgrades to a
  # dependency with a known high-severity vulnerability.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build
      - run: make lint
      - run: make test
