[project]
name = "demoapp"
version = "0.2.0"
description = "Multi-tenant B2B workspace and invoice service for a hardened CI pipeline with CodeMender."
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "faker==40.44.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
