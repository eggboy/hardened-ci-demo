[project]
name = "demoapp"
version = "0.1.0"
description = "Small Flask service used to demonstrate a hardened CI pipeline with CodeMender."
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "faker==40.44.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
testpaths = ["tests"]
